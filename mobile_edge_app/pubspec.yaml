name: hazard_edge_app
description: "HazardSense Edge Mobile Application - 50Hz Sensor Polling, SVM Fall Detection, Zero-Touch Camera, SQLCipher, and WorkManager Sync"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # FR-1.1: 50 Hz Hardware Sensor Stream Listener
  sensors_plus: ^4.0.2
  
  # FR-1.2: On-Device TFLite Kinematic Inference
  tflite_flutter: ^0.10.4
  
  # FR-2.1: Zero-Touch Lockless Camera Trigger
  camera: ^0.10.5+9
  
  # FR-1.3: SQLCipher AES-256 Encrypted Offline Database
  sqflite_sqlcipher: ^3.1.0+1
  
  # FR-1.4: Background Auto-Sync Service
  workmanager: ^0.5.2
  
  # Networking & HTTP Uploads
  http: ^1.2.0
  
  # Geolocation & GPS Tracking
  geolocator: ^11.0.0
  
  # File System & Path Providers
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # UI & State Helpers
  intl: ^0.19.0
  uuid: ^4.3.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/fall_detection_model.tflite
